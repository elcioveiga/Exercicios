<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício16</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="../" class="btn-voltar">⬅ Voltar ao menu</a>
    
    <main class="container">
        <span class="etiqueta">Exercício16</span>
        <h1>Lista de Participantes</h1>
        <p class="introdução">Adicione nomes e acompanhe armazenados no array</p>
    
        <section class="painel-array">
            <article>
                <span>Quantidade</span>
                <strong id="quantidade">0</strong>
            </article>

            <article>
                <span>Primeiro nome</span>
                <strong id="primeiroNome">--</strong>
            </article>

            <article>
                <span>Último nome</span>
                <strong id="ultimoNome">--</strong>
            </article>
        </section>

        <label for="nome">Nome do participante:</label>
        <input 
            type="text"
            id="nome"
            placeholder="Exemp: Mariana"
            autocomplete="off"
        >

        <div class="botões">
            <button onclick="adicionarNome()">Adicionar nome</button>
            <button class="secundario" onclick="limparLista()">Limpar lista</button>
        </div>

        <p id="mensagem" class="mensagem" aria-live="polite">
            Digite um nome para começar.
        </p>

        <section class="lista-container">
            <h2>Nomes cadastrados</h2>
            <ol id="listaNomes">
                <li class="vazio">Nenhum nome cadastrado.</li>
            </ol>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
